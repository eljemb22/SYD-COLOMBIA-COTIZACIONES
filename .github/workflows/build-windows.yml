name: Build and release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      gitlab_tag:
        description: Etiqueta de GitHub cuya release portable se copiará a GitLab
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installer and portable app
        run: npm run desktop:build
        env:
          ELECTRON_PUBLISH: always
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish portable update mirror to GitLab
        shell: pwsh
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:GITLAB_TOKEN) {
            throw 'Configura GITLAB_TOKEN en GitHub → Settings → Secrets and variables → Actions.'
          }
          .\scripts\publish-gitlab-release.ps1 -Token $env:GITLAB_TOKEN -Tag $env:RELEASE_TAG

  mirror-existing-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download portable from GitHub and publish it to GitLab
        shell: pwsh
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          RELEASE_TAG: ${{ inputs.gitlab_tag }}
        run: |
          if (-not $env:GITLAB_TOKEN) {
            throw 'Configura GITLAB_TOKEN en GitHub → Settings → Secrets and variables → Actions.'
          }
          $tag = $env:RELEASE_TAG
          $version = $tag -replace '^v', ''
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/eljemb22/SYD-COLOMBIA-COTIZACIONES/releases/tags/$tag" -Headers @{ 'User-Agent' = 'SYD-Colombia-Update-Mirror' } -TimeoutSec 30
          $asset = $release.assets | Where-Object { $_.name -in @("SYD-Colombia-Portable-$version.exe", "SYD Colombia Portable $version.exe") } | Select-Object -First 1
          if (-not $asset) { throw "La release $tag de GitHub no contiene el portable." }
          $portablePath = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $portablePath -TimeoutSec 600
          .\scripts\publish-gitlab-release.ps1 -Token $env:GITLAB_TOKEN -Tag $tag -PortablePath $portablePath
