<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100" fill="none">
  <!-- Clean white document canvas -->
  <rect width="850" height="1100" fill="#FFFFFF"/>

  <!-- ========================================================================= -->
  <!-- 1. LEFT VERTICAL BRAND STRIP (Cyan top/center + Royal Navy bottom)        -->
  <!-- ========================================================================= -->
  <!-- Cyan vertical bar (0 to 825px) -->
  <rect x="0" y="0" width="34" height="825" fill="#009fe3"/>
  
  <!-- "Nit.: 802.000.608-7" reading vertically upwards in the upper section -->
  <g transform="translate(17, 240) rotate(-90)">
    <text text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="0.8">Nit.: 802.000.608-7</text>
  </g>

  <!-- Deep royal navy vertical block at bottom (825px to 1100px) -->
  <rect x="0" y="825" width="34" height="275" fill="#003882"/>

  <!-- "www.syd.com.co" reading vertically upwards centered in navy block -->
  <g transform="translate(17, 962) rotate(-90)">
    <text text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="700" font-size="15.5" letter-spacing="0.5">www.syd.com.co</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. TOP RIGHT: SyD Colombia S.A. CORPORATE LOGO                            -->
  <!-- ========================================================================= -->
  <g transform="translate(626, 48) scale(1.52)">
    <!-- Main S (Cyan) -->
    <path d="M 32 18 C 32 12 26 10 18 10 C 10 10 4 13 2 18 C 0 23 3 30 14 33 C 26 36 29 42 28 48 C 26 56 17 60 8 58 C 2 56 0 52 0 52 L 4 43 C 4 43 8 47 13 48 C 18 49 22 47 23 42 C 24 37 21 32 11 29 C 1 25 -2 18 1 10 C 4 2 13 0 24 0 C 31 0 37 3 39 7 Z" fill="#009fe3"/>
    
    <!-- y (Body + Head Dot in Navy Blue) -->
    <circle cx="48" cy="14.5" r="4.6" fill="#003882"/>
    <path d="M 36 26 C 40 26 44 30 46 34 L 50 43 L 56 26 L 65 26 L 54 50 C 50 58 44 64 36 65 C 32 65 29 63 29 63 L 31 55 C 31 55 34 56 37 55 C 41 53 43 49 44 45 L 34 26 Z" fill="#003882"/>
    
    <!-- Dynamic Cyan Swoosh crossing y and D -->
    <path d="M 40 21 C 50 11 66 5 82 0 C 70 6 58 14 49 23 Z" fill="#009fe3"/>
    
    <!-- D (Cyan) -->
    <path d="M 58 10 L 72 10 C 86 10 96 18 94 34 C 92 50 79 58 66 58 L 52 58 Z M 64 20 L 61 48 L 68 48 C 76 48 82 43 83 34 C 84 25 79 20 71 20 Z" fill="#009fe3"/>
    
    <!-- Registered Symbol ® -->
    <circle cx="98" cy="12" r="5" stroke="#003882" stroke-width="1.1" fill="none"/>
    <text x="98" y="14.5" font-family="'Segoe UI', Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#003882" text-anchor="middle">R</text>
    
    <!-- Colombia S.A. Italic Text -->
    <text x="2" y="74" font-family="'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="bold" font-style="italic" fill="#003882" letter-spacing="1.2">
      Colombia <tspan font-size="10" font-style="normal" font-weight="700">S.A.</tspan>
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. BOTTOM RIGHT: ICONTEC ISO 9001 + IQNET CERTIFICATION BADGES             -->
  <!-- ========================================================================= -->
  <!-- Icontec ISO 9001 Badge -->
  <g transform="translate(638, 946) scale(1.15)">
    <!-- Outer Cyan Rounded Pill/Card -->
    <rect x="0" y="0" width="56" height="66" rx="8" fill="#009fe3"/>
    
    <!-- icontec Circular Nested Rings -->
    <g transform="translate(28, 16)" stroke="#FFFFFF" fill="none" stroke-width="1.8">
      <circle cx="0" cy="0" r="8.5" stroke-dasharray="45 6"/>
      <circle cx="0" cy="0" r="5" stroke-dasharray="24 5"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>
    
    <!-- icontec Text -->
    <text x="28" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.2">icontec</text>
    
    <!-- White Inner Capsule -->
    <rect x="5" y="38" width="46" height="22" rx="4" fill="#FFFFFF"/>
    
    <!-- ISO 9001 text inside white capsule -->
    <text x="28" y="53" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#009fe3" text-anchor="middle">ISO 9001</text>
    
    <!-- Certificate Code SC7290-1 in cyan on white paper below card -->
    <text x="28" y="79" font-family="'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#009fe3" text-anchor="middle">SC7290-1</text>
  </g>

  <!-- IQNET International Certification Seal -->
  <g transform="translate(720, 944) scale(1.15)">
    <!-- Dark Navy Circle -->
    <circle cx="36" cy="36" r="36" fill="#003882"/>
    
    <!-- Dotted Arc Pattern -->
    <g fill="#9ABAEB">
      <circle cx="24" cy="14" r="1.2"/>
      <circle cx="28" cy="12" r="1.4"/>
      <circle cx="32" cy="11" r="1.5"/>
      <circle cx="36" cy="10.5" r="1.6"/>
      <circle cx="40" cy="11" r="1.5"/>
      <circle cx="44" cy="12" r="1.4"/>
      <circle cx="48" cy="14" r="1.2"/>
      
      <circle cx="21" cy="18" r="1.1"/>
      <circle cx="25" cy="16" r="1.2"/>
      <circle cx="30" cy="14.5" r="1.3"/>
      <circle cx="36" cy="14" r="1.4"/>
      <circle cx="42" cy="14.5" r="1.3"/>
      <circle cx="47" cy="16" r="1.2"/>
      <circle cx="51" cy="18" r="1.1"/>
    </g>
    
    <!-- IQNET Text -->
    <text x="36" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">IQNET</text>
    
    <!-- Certified Management System Subtitle -->
    <text x="36" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">CERTIFIED</text>
    <text x="36" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="4.2" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.3">MANAGEMENT</text>
    <text x="36" y="57" font-family="'Segoe UI', Arial, sans-serif" font-size="4.2" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.3">SYSTEM</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. BOTTOM ADDRESSES (4 Branches: Barranquilla, Bogotá, Medellín, Popayán) -->
  <!-- ========================================================================= -->
  <g text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="9.6" fill="#003882">
    <text x="622" y="974">
      <tspan font-weight="bold">Barranquilla:</tspan> Carrera 43 N° 80-59 - PBX: (605) 3302424 - Fax: (5) 3302420
    </text>
    <text x="622" y="992">
      <tspan font-weight="bold">Bogotá:</tspan> Avenida Calle 24 N° 95-12 Bodega 26 - Centro Industrial Portos - Fontibón - PBX: (601) 4289146/7/8
    </text>
    <text x="622" y="1010">
      <tspan font-weight="bold">Medellín:</tspan> Calle 31 N° 43-32 San Diego - Tel: (604) 4089478 - (604) 4084308
    </text>
    <text x="622" y="1028">
      <tspan font-weight="bold">Popayán:</tspan> Carrera 17 # 15-16 Bodega 9 - Tel: (602) 8339575 - Cel: 3176446330
    </text>
  </g>
</svg>
