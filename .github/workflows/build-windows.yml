name: Build and release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      gitlab_tag:
        description: Etiqueta de GitHub cuya release portable e instalador se copiarán a GitLab
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installer and portable app
        run: npm run desktop:build
        env:
          ELECTRON_PUBLISH: always
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish portable, installer and update feed to GitLab
        shell: pwsh
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PACKAGE_TOKEN: ${{ secrets.GITLAB_PACKAGE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:GITLAB_TOKEN) {
            throw 'Configura GITLAB_TOKEN en GitHub → Settings → Secrets and variables → Actions.'
          }
          if (-not $env:GITLAB_PACKAGE_TOKEN) {
            throw 'Configura GITLAB_PACKAGE_TOKEN en GitHub → Settings → Secrets and variables → Actions.'
          }
          .\scripts\publish-gitlab-release.ps1 -Token $env:GITLAB_TOKEN -PackageToken $env:GITLAB_PACKAGE_TOKEN -Tag $env:RELEASE_TAG

  mirror-existing-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets from GitHub and publish them to GitLab
        shell: pwsh
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PACKAGE_TOKEN: ${{ secrets.GITLAB_PACKAGE_TOKEN }}
          RELEASE_TAG: ${{ inputs.gitlab_tag }}
        run: |
          if (-not $env:GITLAB_TOKEN) {
            throw 'Configura GITLAB_TOKEN en GitHub → Settings → Secrets and variables → Actions.'
          }
          if (-not $env:GITLAB_PACKAGE_TOKEN) {
            throw 'Configura GITLAB_PACKAGE_TOKEN en GitHub → Settings → Secrets and variables → Actions.'
          }
          $tag = $env:RELEASE_TAG
          $version = $tag -replace '^v', ''
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/eljemb22/SYD-COLOMBIA-COTIZACIONES/releases/tags/$tag" -Headers @{ 'User-Agent' = 'SYD-Colombia-Update-Mirror' } -TimeoutSec 30
          $asset = $release.assets | Where-Object { $_.name -in @("SYD-Colombia-Portable-$version.exe", "SYD Colombia Portable $version.exe") } | Select-Object -First 1
          if (-not $asset) { throw "La release $tag de GitHub no contiene el portable." }
          $portablePath = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $portablePath -TimeoutSec 600
          $installer = $release.assets | Where-Object { $_.name -in @("SYD Colombia Setup $version.exe", "SYD-Colombia-Setup-$version.exe") } | Select-Object -First 1
          $latestYml = $release.assets | Where-Object { $_.name -eq 'latest.yml' } | Select-Object -First 1
          if (-not $installer -or -not $latestYml) { throw "La release $tag no contiene el instalador NSIS y latest.yml requeridos para actualizar desde GitLab." }
          $blockmap = $release.assets | Where-Object { $_.name -eq "$($installer.name).blockmap" } | Select-Object -First 1
          if (-not $blockmap) { throw "La release $tag no contiene $($installer.name).blockmap." }
          $installerPath = Join-Path $env:RUNNER_TEMP $installer.name
          $latestYmlPath = Join-Path $env:RUNNER_TEMP $latestYml.name
          $blockmapPath = Join-Path $env:RUNNER_TEMP $blockmap.name
          Invoke-WebRequest -Uri $installer.browser_download_url -OutFile $installerPath -TimeoutSec 600
          Invoke-WebRequest -Uri $latestYml.browser_download_url -OutFile $latestYmlPath -TimeoutSec 60
          Invoke-WebRequest -Uri $blockmap.browser_download_url -OutFile $blockmapPath -TimeoutSec 60
          .\scripts\publish-gitlab-release.ps1 -Token $env:GITLAB_TOKEN -PackageToken $env:GITLAB_PACKAGE_TOKEN -Tag $tag -PortablePath $portablePath -InstallerPath $installerPath -LatestYmlPath $latestYmlPath -BlockmapPath $blockmapPath
