name: Build and release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installer and portable app
        run: npm run desktop:build
        env:
          ELECTRON_PUBLISH: always
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish portable update mirror to GitLab
        shell: pwsh
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:GITLAB_TOKEN) {
            throw 'Configura GITLAB_TOKEN en GitHub → Settings → Secrets and variables → Actions.'
          }
          .\scripts\publish-gitlab-release.ps1 -Token $env:GITLAB_TOKEN -Tag $env:RELEASE_TAG
